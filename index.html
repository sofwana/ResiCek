<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Resi Paket - BinderByte</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-container {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .status-box {
            background-color: #e9f7ef;
            padding: 15px;
            border-left: 5px solid #28a745;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .timeline {
            list-style: none;
            padding: 0;
        }
        .timeline li {
            padding: 10px 0;
            border-bottom: 1px dashed #ccc;
        }
        .timeline li:last-child {
            border-bottom: none;
        }
        .date {
            font-size: 0.85em;
            color: #777;
            display: block;
            margin-bottom: 3px;
        }
        .desc {
            color: #333;
        }
        .error {
            color: #dc3545;
            background-color: #f8d7da;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #f5c6cb;
            text-align: center;
        }
        .loading {
            text-align: center;
            color: #007bff;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Cek Resi Paket</h2>
    
    <div class="form-group">
        <label for="courier">Pilih Ekspedisi</label>
        <select id="courier">
            <option value="jne">JNE</option>
            <option value="jnt">J&T Express</option>
            <option value="sicepat">SiCepat</option>
            <option value="anteraja">AnterAja</option>
            <option value="pos">POS Indonesia</option>
            <option value="tiki">TIKI</option>
            <option value="ninja">Ninja Xpress</option>
            <option value="lion">Lion Parcel</option>
            <option value="spx">Shopee Express</option>
        </select>
    </div>
    
    <div class="form-group">
        <label for="awb">Nomor Resi</label>
        <input type="text" id="awb" placeholder="Contoh: JP1234567890">
    </div>
    
    <button onclick="cekResi()" id="btn-cek">Lacak Paket</button>

    <div id="result" class="result-container" style="display: none;">
        <!-- Hasil pencarian akan muncul di sini -->
    </div>
</div>

<script>
    // API Key Anda dari BinderByte
    const API_KEY = "sk_tytmmq2pcp6xlvrflkml95bq8a1inllrohhgahsgg0nd0ibdfh4upmahpb8mfzoh";

    async function cekResi() {
        const awb = document.getElementById("awb").value.trim();
        const courier = document.getElementById("courier").value;
        const resultDiv = document.getElementById("result");
        const btnCek = document.getElementById("btn-cek");

        if (!awb) {
            resultDiv.style.display = "block";
            resultDiv.innerHTML = `<div class="error">Silakan masukkan nomor resi terlebih dahulu!</div>`;
            return;
        }

        // Tampilkan loading
        resultDiv.style.display = "block";
        resultDiv.innerHTML = `<div class="loading">Sedang melacak paket... Mohon tunggu.</div>`;
        btnCek.disabled = true;

        try {
            // Memanggil API BinderByte
            const response = await fetch(`https://api.binderbyte.com/v1/track?api_key=${API_KEY}&courier=${courier}&awb=${awb}`);
            const data = await response.json();

            // Cek apakah response sukses (status 200)
            if (data.status !== 200) {
                resultDiv.innerHTML = `<div class="error"><strong>Error:</strong> ${data.message}</div>`;
                btnCek.disabled = false;
                return;
            }

            // Mengambil data detail paket dan riwayat perjalanan
            const summary = data.data.summary;
            const history = data.data.history;

            // Membuat tampilan hasil
            let html = `
                <div class="status-box">
                    <h3 style="margin-top:0; color:#28a745;">Status: ${summary.status}</h3>
                    <p><strong>Kurir:</strong> ${summary.courier}</p>
                    <p><strong>Pengirim:</strong> ${summary.shipper}</p>
                    <p><strong>Penerima:</strong> ${summary.receiver}</p>
                    <p><strong>Asal:</strong> ${summary.origin}</p>
                    <p><strong>Tujuan:</strong> ${summary.destination}</p>
                </div>
                <h4>Riwayat Perjalanan:</h4>
                <ul class="timeline">
            `;

            // Loop untuk setiap riwayat perjalanan (dari yang terbaru ke terlama)
            history.forEach(item => {
                html += `
                    <li>
                        <span class="date">${item.date}</span>
                        <span class="desc">${item.desc}</span>
                    </li>
                `;
            });

            html += `</ul>`;
            
            // Tampilkan ke layar
            resultDiv.innerHTML = html;

        } catch (error) {
            resultDiv.innerHTML = `<div class="error">Terjadi kesalahan pada sistem atau jaringan. Pastikan koneksi internet Anda stabil.</div>`;
        } finally {
            btnCek.disabled = false;
        }
    }
</script>

</body>
</html>
